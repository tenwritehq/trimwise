[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "langchain-trimwise"
version = "0.1.0"
description = "Shared-budget extractive context trimming for LangChain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aakash"}]
dependencies = ["trimwise>=0.7,<0.8", "langchain-core>=1.6.10,<2"]

[project.optional-dependencies]
test = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2"]

[project.urls]
Documentation = "https://github.com/tenwritehq/trimwise/blob/main/integrations/langchain/README.md"
Issues = "https://github.com/tenwritehq/trimwise/issues"
Source = "https://github.com/tenwritehq/trimwise/tree/main/integrations/langchain"

[tool.flit.module]
name = "langchain_trimwise"

[tool.flit.sdist]
include = ["tests/*.py", "examples/minimal.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
