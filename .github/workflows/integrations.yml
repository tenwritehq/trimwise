name: Framework integrations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.integration }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [langchain, llama-index]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            integrations/${{ matrix.integration }}/pyproject.toml
      - run: python -m pip install -e ".[dev]" "./integrations/${{ matrix.integration }}[test]"
      - run: ruff check integrations/${{ matrix.integration }}
      - run: ruff format --check integrations/${{ matrix.integration }}
      - run: >-
          mypy --strict --explicit-package-bases
          integrations/${{ matrix.integration }}/src
          integrations/${{ matrix.integration }}/tests
          integrations/${{ matrix.integration }}/examples/minimal.py
        env:
          MYPYPATH: integrations/${{ matrix.integration }}/src
      - run: python -m build integrations/${{ matrix.integration }}
      - run: python -m pip install --force-reinstall --no-deps integrations/${{ matrix.integration }}/dist/*.whl
      - run: python -m pip check
      - run: >-
          python -m pytest integrations/${{ matrix.integration }}/tests
          -c integrations/${{ matrix.integration }}/pyproject.toml
      - run: python integrations/${{ matrix.integration }}/examples/minimal.py

  pdf-examples:
    name: Native PDF examples / CPU contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install -e . -e ./integrations/langchain
          -e ./integrations/llama-index
          -e './integrations/_example_support/pdf-rag-playground[dev]'
      - run: ruff check integrations/_example_support integrations/langchain/examples integrations/llama-index/examples
      - run: ruff format --check integrations/_example_support integrations/langchain/examples integrations/llama-index/examples
      - run: >-
          python -m pytest
          -c integrations/_example_support/pdf-rag-playground/pyproject.toml
          integrations/_example_support/pdf-rag-playground/tests
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          GGML_VK_VISIBLE_DEVICES: "-1"
